name: Release (pacote Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Versão do pacote (version.txt)
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tag confere com version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ("v$env:VERSION" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME diferente de version.txt ($env:VERSION)" }

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.10.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: "Testes: shared"
        run: pnpm --filter @mesa/shared exec vitest run --reporter=default --reporter=github-actions

      - name: "Testes: launcher"
        if: ${{ !cancelled() }}
        run: pnpm --filter @mesa/launcher exec vitest run --reporter=default --reporter=github-actions

      - name: "Testes: web"
        if: ${{ !cancelled() }}
        run: pnpm --filter @mesa/web exec vitest run --reporter=default --reporter=github-actions

      - name: "Testes: worker"
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @mesa/worker run ensure-assets
          pnpm --filter @mesa/worker exec vitest run --reporter=default --reporter=github-actions

      - name: Build do front
        run: pnpm build

      - name: Montar o pacote (Node e cloudflared com SHA-256 conferido)
        run: pnpm win:package

      - name: Teste de fumaça no zip extraído
        timeout-minutes: 5
        run: |
          $zip = "dist-win\MesaVirtual-v$env:VERSION-win64.zip"
          $dir = Join-Path $env:RUNNER_TEMP 'fumaca com espaco'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $dir
          if ($LASTEXITCODE -ne 0) { throw 'falha ao extrair o zip' }
          $env:MESA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'dados da fumaca'
          $pkg = Join-Path $dir 'MesaVirtual'
          & "$pkg\app\node\node.exe" "$pkg\app\launcher\launcher.mjs" --root $pkg --smoke --port 18787
          if ($LASTEXITCODE -ne 0) { throw "teste de fumaça falhou (código $LASTEXITCODE)" }

      - name: Criar a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          "dist-win\MesaVirtual-v$env:VERSION-win64.zip"
          --title "Mesa Virtual $env:GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
